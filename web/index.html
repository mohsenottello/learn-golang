<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <style>
    /* ---- account editor layout: pinned sidebar + content ---- */

    .editor-shell { padding: 0; }
    .editor { display: flex; min-height: calc(100vh - 64px); margin: 0; }
    .editor-side { box-sizing: border-box; width: 240px; flex: 0 0 240px; background: #fff; border-right: 1px solid #e0e0e0; position: sticky; top: 64px; height: calc(100vh - 64px); display: flex; flex-direction: column; }
    .editor-side-name { padding: 1.25rem 1.25rem 0.75rem; font-weight: 600; color: #444; border-bottom: 1px solid #eee; overflow-wrap: anywhere; }
    .editor-nav { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.25rem; color: #555; }
    .editor-nav .material-icons { font-size: 20px; color: #888; }
    .editor-nav:hover { background: #f5f5f5; }
    .editor-nav.active { background: #e0f2f1; color: #00695c; border-right: 3px solid #009688; }
    .editor-nav.active .material-icons { color: #00695c; }
    .editor-side-foot { margin-top: auto; padding: 1rem 1.25rem; font-size: 0.85rem; color: #666; border-top: 1px solid #eee; }
    .editor-main { flex: 1; min-width: 0; padding: 1.5rem 2rem; max-width: 1100px; box-sizing: border-box; }
    .editor-main .card { width: 100%; }
    .editor-main table { width: 100%; }
    .input-field label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    @media (max-width: 720px) { .editor { flex-direction: column; } .editor-side { width: 100%; flex: none; position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .editor-side-name, .editor-side-foot { width: 100%; box-sizing: border-box; } .editor-main { max-width: none; padding: 1rem; } }


    /* ---- public resume layout (mirrors the two-column PDF) ---- */
    .cv { display: grid; grid-template-columns: 300px 1fr; max-width: 1000px; margin: 2rem auto; background: var(--main-bg, #fff);
          box-shadow: 0 2px 12px rgba(0,0,0,.12); font-size: 14px; color: var(--main-text, #222); }
    .cv-side { background: var(--side-bg, #7f7a72); color: var(--side-text, #fff); padding: 2rem 1.5rem; }
    .cv-main { padding: 2rem 2rem 2rem 2.5rem; }
    .cv-photo { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 1rem;
                border: 4px solid rgba(255,255,255,.6); }
    .cv-name { font-size: 1.4rem; font-weight: 700; text-align: center; margin: .5rem 0 .25rem; letter-spacing: .05em; }
    .cv-title, .cv-subtitle { text-align: center; opacity: .95; }
    .cv-subtitle { font-size: .9rem; }
    .cv-section { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem;
                  border-bottom: 2px solid rgba(255,255,255,.7); padding-bottom: .25rem; margin: 1.75rem 0 .75rem; }
    .cv-side a { color: var(--side-text, #fff); text-decoration: underline; }
    .cv-contact, .cv-list { margin: 0; padding-left: 0; list-style: none; }
    .cv-contact li { display: flex; align-items: center; gap: .5rem; margin: .4rem 0; }
    .cv-list li { margin: .5rem 0; }
    .cv-list li::before { content: "•"; margin-right: .5rem; }
    .cv-about { line-height: 1.5; font-size: .9rem; }
    .cv-muted { opacity: .85; font-size: .9rem; }
    .cv-main-title { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 1rem; color: var(--accent, #555);
                     border-top: 2px solid var(--accent, #555); border-bottom: 1px solid var(--accent, #ccc); padding: .5rem 0; text-align: center; margin-bottom: 1.5rem; }
    .cv-job { margin-bottom: 1.75rem; }
    .cv-job-head { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--accent, #ddd); padding-bottom: .5rem; margin-bottom: .5rem; }
    .cv-job-meta { text-align: right; white-space: nowrap; }
    .cv-role { text-transform: uppercase; font-size: .85rem; font-weight: 600; color: var(--main-text, #444); }
    .cv-main .cv-muted { color: #666; }
    .cv-job { margin-bottom: 1.5rem; }
    .cv-job + .cv-job { border-top: 1px solid var(--accent, #ccc); padding-top: 1.25rem; }
    .cv-bullets { margin: 0; padding-left: 1.25rem; }
    .cv-main ul.cv-bullets > li { list-style: disc; margin: .25rem 0; line-height: 1.45; }
    .cv-langbar { max-width: 1000px; margin: 1rem auto -1.5rem; text-align: right; font-size: .85rem; }
    .cv-langbar a { color: #666; padding: .25rem .6rem; border-radius: 3px; margin-left: .25rem; }
    .cv-langbar a.active { background: #7f7a72; color: #fff; }
    .toast-item.success { background: #00897b; }
    .toast-item.error   { background: #c62828; }
    .theme-preview { display: grid; grid-template-columns: 38% 1fr; height: 180px; border: 1px solid #ddd;
                 border-radius: 4px; overflow: hidden; font-size: 10px; }
    .tp-side { background: var(--side-bg); color: var(--side-text); padding: 10px; }
    .tp-main { background: var(--main-bg); color: var(--main-text); padding: 10px; }
    .tp-photo { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.5); margin: 0 auto 6px; }
    .tp-name { text-align: center; font-weight: 700; letter-spacing: .05em; }
    .tp-rule { border-bottom: 1px solid var(--side-text); margin: 8px 0 6px; opacity: .8; }
    .tp-line { height: 5px; border-radius: 2px; background: currentColor; opacity: .35; margin: 4px 0; }
    .tp-line.short { width: 60%; }
    .tp-line.dark { opacity: .7; }
    .tp-title { color: var(--accent); border-top: 2px solid var(--accent); border-bottom: 1px solid #ccc;
                text-align: center; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 0; margin-bottom: 8px; }
    .tp-job + .tp-job { border-top: 1px solid var(--accent); padding-top: 6px; margin-top: 6px; }
    @keyframes toast-in  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
    @media (max-width: 720px) { .cv { grid-template-columns: 1fr; } .cv-job-head { flex-direction: column; } .cv-job-meta { text-align: left; } }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      .cv-langbar { display: none; }
      .cv { box-shadow: none; margin: 0; max-width: none; min-height: 297mm; }
      .cv-side { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body class="grey lighten-4">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
