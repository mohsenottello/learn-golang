<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <link id="favicon" rel="icon" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" defer></script>

  <style>
    /* --primary / --primary-dark are set by the app from site settings (site.tsx). */
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --navy: #18223c;
      --muted: #64708b;
      --background: #f8f9ff;
      --lavender: #eeecff;
    }

    /* ========== site theme + home page ========== */
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body { font-family: 'Inter', sans-serif; color: var(--navy); margin: 0; background: #fff; line-height: 1.7; }
    a { transition: color .2s ease, background .2s ease; }
    .container { width: 90%; max-width: 1200px; }
    h1, h2, h3, h4, h5 { color: var(--navy); font-weight: 800; line-height: 1.25; }
    p { color: var(--muted); }

    /* Navigation */
    nav { background: rgba(255,255,255,.96); box-shadow: 0 2px 18px rgba(24,34,60,.05); height: 76px; line-height: 76px;
          position: sticky; top: 0; z-index: 1000; }
    nav .nav-wrapper { height: 76px; }
    .brand-logo { color: var(--navy) !important; font-size: 21px !important; font-weight: 800; white-space: nowrap; }
    .brand-logo i { color: var(--primary); font-size: 30px; vertical-align: middle; margin-right: 8px; }
    nav ul a { color: #374151; font-size: 13px; font-weight: 600; padding: 0 17px; }
    nav ul a:hover { background: transparent; color: var(--primary); }
    .nav-cta { background: var(--primary); color: #fff !important; height: 42px; line-height: 42px; margin-top: 17px;
               border-radius: 30px; padding: 0 24px !important; }
    .nav-cta:hover { background: var(--primary-dark) !important; color: #fff !important; }
    .sidenav li > a { font-weight: 600; }

    /* Buttons */
    .btn-main { background: var(--primary); color: #fff; border-radius: 30px; padding: 0 27px; height: 49px; line-height: 49px;
                font-size: 13px; font-weight: 700; text-transform: none; box-shadow: 0 8px 20px rgba(79,70,229,.19); }
    .btn-main:hover { background: var(--primary-dark); box-shadow: 0 10px 24px rgba(79,70,229,.25); }
    .btn-outline { display: inline-block; color: var(--primary); border: 1px solid #dcdafe; border-radius: 30px; padding: 0 25px;
                   height: 49px; line-height: 47px; font-size: 13px; font-weight: 700; }
    .btn-outline:hover { background: var(--lavender); color: var(--primary-dark); }
    .btn .material-icons { font-size: 18px; vertical-align: middle; margin-left: 5px; }

    /* Hero */
    .hero { padding: 65px 0 75px; overflow: hidden;
            background: radial-gradient(ellipse at 80% 30%, #f0edff 0%, transparent 35%), linear-gradient(135deg, #fff 45%, #faf9ff 100%); }
    .hero-copy { padding-top: 25px !important; }
    .script-text { font-family: 'Caveat', cursive; font-size: 34px; color: var(--primary); margin: 0 0 5px; line-height: 1.3; }
    .hero h1 { font-size: clamp(36px, 4.2vw, 58px); letter-spacing: -2px; margin: 8px 0 22px; }
    .hero-description { font-size: 17px; line-height: 1.9; max-width: 490px; margin-bottom: 30px; }
    .hero-buttons { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .hero-note { font-size: 12px; margin-top: 20px; }
    .hero-note i { font-size: 16px; vertical-align: middle; color: var(--primary); }
    .portrait-wrap { position: relative; max-width: 460px; margin: 0 auto; padding: 18px; }
    .portrait-shape { position: absolute; inset: 5px 5px 0 30px; background: linear-gradient(135deg, #dce6ff, #dcd5ff);
                      border-radius: 45% 40% 35% 45%; transform: rotate(-5deg); }
    .portrait { display: block; position: relative; z-index: 1; width: 100%; height: 420px; object-fit: cover; object-position: center;
                border-radius: 45% 40% 30% 35%; box-shadow: 0 20px 55px rgba(24,34,60,.13); background: #e8e8f7; }
    .floating-note { position: absolute; z-index: 2; right: -8px; bottom: 35px; background: #fff; padding: 13px 18px; border-radius: 15px;
                     box-shadow: 0 10px 35px rgba(24,34,60,.1); font-size: 12px; font-weight: 700; }
    .floating-note i { color: var(--primary); vertical-align: middle; margin-right: 5px; }

    /* Sections */
    .section-padding { padding: 80px 0; }
    .section-label { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; font-size: 11px; font-weight: 800; margin-bottom: 12px; }
    .section-heading { font-size: clamp(28px, 3vw, 38px); letter-spacing: -1px; margin: 0 0 15px; }
    .section-intro { max-width: 620px; margin: 0 auto 45px; font-size: 15px; }

    /* Features */
    .features-section { background: var(--background); }
    .feature-card { background: #fff; border: 1px solid #efeff8; border-radius: 20px; padding: 30px 22px; height: 100%; min-height: 260px;
                    transition: transform .25s ease, box-shadow .25s ease; }
    .feature-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(24,34,60,.07); }
    .feature-icon { width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
    .feature-icon i { font-size: 29px; }
    .icon-teal { background: #d9f7f2; color: #087e78; }
    .icon-purple { background: #eee5ff; color: #7041c5; }
    .icon-pink { background: #ffe4ef; color: #be185d; }
    .icon-blue { background: #dff1ff; color: #0369a1; }
    .feature-card h5 { font-size: 16px; margin: 0 0 12px; }
    .feature-card p { font-size: 13px; margin: 0; line-height: 1.9; }

    /* Resume preview */
    .resume-section { overflow: hidden; }
    .resume-illustration { padding: 20px 35px; }
    .resume-paper { background: #fff; border: 1px solid #e9eaf3; border-radius: 8px; box-shadow: 0 20px 60px rgba(24,34,60,.12); padding: 25px;
                    transform: rotate(-2deg); max-width: 360px; margin: 0 auto; }
    .resume-person { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #ececf5; padding-bottom: 16px; margin-bottom: 17px; }
    .resume-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--lavender); color: var(--primary); display: flex; align-items: center; justify-content: center; }
    .resume-person h5 { font-size: 13px; margin: 0 0 3px; }
    .resume-person p { font-size: 10px; margin: 0; }
    .resume-line-title { font-size: 11px; color: var(--primary); font-weight: 800; margin: 15px 0 8px; }
    .resume-line { height: 6px; background: #e8eaf3; border-radius: 10px; margin: 8px 0; }
    .resume-line.short { width: 58%; } .resume-line.medium { width: 78%; } .resume-line.long { width: 100%; }
    .resume-skills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .resume-skills span { background: var(--lavender); color: var(--primary); border-radius: 20px; font-size: 9px; padding: 4px 9px; }
    .resume-copy { padding: 30px 20px !important; }
    .resume-copy p { font-size: 15px; line-height: 1.9; margin-bottom: 25px; }
    .resume-url { display: block; margin-top: 15px; color: var(--primary); font-size: 13px; font-weight: 600; }
    .resume-url i { font-size: 16px; vertical-align: middle; margin-right: 6px; }

    /* Call to action */
    .cta-section { padding: 75px 0; background: linear-gradient(135deg, #222a49, #37336d); position: relative; overflow: hidden; }
    .cta-section::before, .cta-section::after { content: ""; position: absolute; width: 250px; height: 250px; border-radius: 50%; background: rgba(196,181,253,.08); }
    .cta-section::before { top: -150px; left: -70px; } .cta-section::after { bottom: -170px; right: -60px; }
    .cta-section h2 { color: #fff; font-size: clamp(28px, 3vw, 38px); letter-spacing: -1px; }
    .cta-section p { color: #dce0f3; max-width: 600px; margin: 0 auto 28px; font-size: 15px; }
    .cta-icon { color: #c4b5fd; font-size: 42px; }

    /* Footer */
    footer { background: #171d33; padding: 38px 0 22px; }
    .footer-brand { color: #fff; font-size: 18px; font-weight: 800; }
    .footer-brand i { color: #a5a0ff; vertical-align: middle; margin-right: 7px; }
    footer p { color: #b7bfd5; font-size: 12px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 22px; justify-content: flex-end; }
    .footer-links a { color: #dce0f3; font-size: 12px; }
    .footer-links a:hover { color: #c4b5fd; }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,.1); margin-top: 25px; padding-top: 15px; }
    .footer-bottom p { margin: 0; }

    /* Responsive */
    @media only screen and (max-width: 992px) {
      nav .brand-logo { left: 0; transform: none; font-size: 19px !important; }
      .hero { padding: 45px 0 60px; } .hero-copy { padding-top: 5px !important; }
      .portrait { height: 350px; } .floating-note { right: 0; } .feature-card { margin-bottom: 15px; }
    }
    @media only screen and (max-width: 600px) {
      nav, nav .nav-wrapper { height: 64px; line-height: 64px; }
      nav .brand-logo { line-height: 64px; font-size: 17px !important; }
      .brand-logo i { font-size: 25px; margin-right: 4px; }
      .hero { padding: 35px 0 50px; } .hero h1 { font-size: 39px; letter-spacing: -1.5px; }
      .hero-description { font-size: 15px; } .script-text { font-size: 29px; }
      .hero-buttons { align-items: stretch; flex-direction: column; } .hero-buttons a { text-align: center; width: 100%; }
      .portrait-wrap { margin-top: 30px; max-width: 350px; } .portrait { height: 330px; }
      .section-padding { padding: 55px 0; } .feature-card { min-height: auto; padding: 25px 18px; }
      .resume-illustration { padding: 10px; } .resume-copy { padding: 35px 5px 0 !important; }
      .cta-section { padding: 55px 0; } .footer-links { justify-content: flex-start; margin-top: 20px; } .footer-bottom { text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }

    /* ========== app pages (editor, admin) ========== */
    .editor-shell { padding: 0; }
    .editor { display: flex; min-height: calc(100vh - 76px); }
    .editor-side { width: 18%; min-width: 180px; max-width: 280px; flex: none; background: #fff; border-right: 1px solid #e0e0e0;
                   position: sticky; top: 76px; height: calc(100vh - 76px); display: flex; flex-direction: column; }
    .editor-side-name { padding: 1.25rem 1.25rem .75rem; font-weight: 600; color: #444; border-bottom: 1px solid #eee; line-height: 1.4; }
    .editor-nav { display: flex; align-items: center; gap: .75rem; padding: .8rem 1.25rem; color: #555; line-height: 1.4; }
    .editor-nav .material-icons { font-size: 20px; color: #888; }
    .editor-nav:hover { background: #f5f5f5; }
    .editor-nav.active { background: var(--lavender); color: var(--primary-dark); border-right: 3px solid var(--primary); }
    .editor-nav.active .material-icons { color: var(--primary-dark); }
    .editor-side-foot { margin-top: auto; padding: 1rem 1.25rem; font-size: .85rem; color: #666; border-top: 1px solid #eee; line-height: 1.4; }
    .editor-main { flex: 1; padding: 1.5rem 3%; }
    .input-field label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .btn.teal { background: var(--primary) !important; }
    .btn.teal:hover { background: var(--primary-dark) !important; }
    .teal-text { color: var(--primary) !important; }
    @media (max-width: 720px) {
      .editor { flex-direction: column; }
      .editor-side { width: auto; max-width: none; position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
      .editor-side-name, .editor-side-foot { width: 100%; }
      .editor-main { padding: 1rem; }
    }

    /* theme preview (resume colours) */
    .theme-preview { display: grid; grid-template-columns: 38% 1fr; height: 180px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; font-size: 10px; }
    .tp-side { background: var(--side-bg); color: var(--side-text); padding: 10px; }
    .tp-main { background: var(--main-bg); color: var(--main-text); padding: 10px; }
    .tp-photo { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.5); margin: 0 auto 6px; }
    .tp-name { text-align: center; font-weight: 700; letter-spacing: .05em; }
    .tp-rule { border-bottom: 1px solid var(--side-text); margin: 8px 0 6px; opacity: .8; }
    .tp-line { height: 5px; border-radius: 2px; background: currentColor; opacity: .35; margin: 4px 0; }
    .tp-line.short { width: 60%; } .tp-line.dark { opacity: .7; }
    .tp-title { color: var(--accent); border-top: 2px solid var(--accent); border-bottom: 1px solid #ccc; text-align: center; font-weight: 700;
                letter-spacing: .08em; text-transform: uppercase; padding: 3px 0; margin-bottom: 8px; }
    .tp-job + .tp-job { border-top: 1px solid var(--accent); padding-top: 6px; margin-top: 6px; }

    /* ========== public resume ========== */
    .cv-langbar { max-width: 1000px; margin: 1rem auto -1.5rem; text-align: right; font-size: .85rem; }
    .cv-langbar a { color: #666; padding: .25rem .6rem; border-radius: 3px; margin-left: .25rem; }
    .cv-langbar a.active { background: var(--side-bg, #7f7a72); color: var(--side-text, #fff); }
    .cv { display: grid; grid-template-columns: 300px 1fr; max-width: 1000px; margin: 2rem auto; background: var(--main-bg, #fff);
          color: var(--main-text, #222); box-shadow: 0 2px 12px rgba(0,0,0,.12); font-size: 14px; font-family: 'Inter', sans-serif; }
    .cv p { color: inherit; }
    .cv-side { background: var(--side-bg, #7f7a72); color: var(--side-text, #fff); padding: 2rem 1.5rem; }
    .cv-main { padding: 2rem 2rem 2rem 2.5rem; }
    .cv-photo { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 1rem; border: 4px solid rgba(255,255,255,.6); }
    .cv-name { font-size: 1.4rem; font-weight: 700; text-align: center; margin: .5rem 0 .25rem; letter-spacing: .05em; color: inherit; }
    .cv-title, .cv-subtitle { text-align: center; opacity: .95; } .cv-subtitle { font-size: .9rem; }
    .cv-section { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; color: inherit;
                  border-bottom: 2px solid var(--side-text, #fff); padding-bottom: .25rem; margin: 1.75rem 0 .75rem; }
    .cv-side a { color: var(--side-text, #fff); text-decoration: underline; }
    .cv-contact, .cv-list { margin: 0; padding-left: 0; list-style: none; }
    .cv-contact li { display: flex; align-items: center; gap: .5rem; margin: .4rem 0; }
    .cv-list li { margin: .5rem 0; } .cv-list li::before { content: "•"; margin-right: .5rem; }
    .cv-about { line-height: 1.5; font-size: .9rem; }
    .cv-muted { opacity: .85; font-size: .9rem; }
    .cv-main-title { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 1rem; color: var(--accent, #555);
                     border-top: 2px solid var(--accent, #555); border-bottom: 1px solid #ccc; padding: .5rem 0; text-align: center; margin-bottom: 1.5rem; }
    .cv-job { margin-bottom: 1.5rem; }
    .cv-job + .cv-job { border-top: 1px solid var(--accent, #ddd); padding-top: 1.25rem; }
    .cv-job-head { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--accent, #ddd); padding-bottom: .5rem; margin-bottom: .5rem; }
    .cv-job-meta { text-align: right; white-space: nowrap; }
    .cv-role { text-transform: uppercase; font-size: .85rem; font-weight: 600; color: var(--accent, #444); }
    .cv-main .cv-muted { color: #666; }
    .cv-bullets { margin: 0; padding-left: 1.25rem; }
    .cv-main ul.cv-bullets > li { list-style: disc; margin: .25rem 0; line-height: 1.45; }
    @media (max-width: 720px) { .cv { grid-template-columns: 1fr; } .cv-job-head { flex-direction: column; } .cv-job-meta { text-align: left; } }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      nav, .cv-langbar { display: none; }
      .cv { box-shadow: none; margin: 0; max-width: none; min-height: 297mm; }
      .cv-side { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
